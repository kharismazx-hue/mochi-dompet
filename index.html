<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mucuans – Financial Tracker Gen Z</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FDFBE3;--card:#fff;--ink:#1d1d2b;--mut:#8a8a99;--sh:0 4px 0 #d9d6ee,0 8px 16px rgba(80,70,140,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1a14;--card:#2a2920;--ink:#f4f2e4;--mut:#a3a08c;--sh:0 4px 0 #14130d}}
:root[data-theme=dark]{--bg:#1b1a14;--card:#2a2920;--ink:#f4f2e4;--mut:#a3a08c;--sh:0 4px 0 #14130d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
#app{position:relative;overflow-x:hidden;max-width:480px;margin:auto;padding:16px 16px 110px;min-height:100vh}
h1{font-size:24px;font-weight:800;margin:0}h2{font-size:19px;font-weight:800;margin:22px 0 10px}
.mut{color:var(--mut);font-size:14px}.top{display:flex;justify-content:space-between;align-items:center}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);font-size:22px;color:var(--ink)}
.ta{display:flex;align-items:center;gap:8px;margin:14px 0 10px;font-weight:800;font-size:12px}.ta b{display:block;font-size:17px}
.asset{border-radius:30px;height:340px;margin:4px 14px;position:relative;overflow:hidden;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.2);background:var(--bgc) center/cover;transition:transform .15s;z-index:1;touch-action:pan-y}
.asset:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%);z-index:1}
.stackw{position:relative;margin-top:10px}.stackw:after{content:"";position:absolute;right:2px;top:16px;bottom:16px;width:40px;border-radius:0 30px 30px 0;background:rgba(40,60,90,.35)}
.glow{position:absolute;left:-20px;right:-20px;top:-20px;height:360px;z-index:-1;opacity:.6;filter:blur(36px)}
.cap{display:flex;flex:4;padding:0!important}.cap button{flex:1;background:none;border:0;padding:12px 4px;font:inherit;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}.cap button+button{border-left:2px solid rgba(128,128,128,.2)}
.pill:active,.feat div:active,.quote:active{transform:scale(.95)}.feat div{cursor:pointer;transition:transform .12s;border-radius:18px;padding:8px 2px}
.pvw{background:rgba(128,128,128,.1);border-radius:24px;padding:16px;text-align:center;margin-bottom:12px;perspective:600px}.pcard{width:150px;height:220px;margin:0 auto 10px;border-radius:24px;background:var(--bgc) center/cover;position:relative;color:#fff;text-align:left;box-shadow:0 14px 20px rgba(0,0,0,.25);transition:transform .1s;touch-action:none}.pcard b{position:absolute;left:12px;bottom:12px;text-shadow:0 1px 6px rgba(0,0,0,.4)}.dompet{position:absolute;right:10px;top:10px;background:#222c;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}
.badge{background:#ece4ff;color:#6a3fd1;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700}.auto{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px;border-radius:16px;background:rgba(128,128,128,.1);font-weight:600}.beta{background:#ffe3a6;color:#8a5a00;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#231d2b;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:40}
.asset>*{position:relative;z-index:2}.chip{position:absolute;left:14px;top:14px;background:rgba(30,40,60,.55);padding:7px 13px;border-radius:20px;font-weight:600;font-size:14px}
.ib{position:absolute;right:16px;top:14px;background:none;border:0;color:#fff;font-size:20px}.pen{position:absolute;left:96px;top:14px;background:rgba(255,255,255,.3);border:0;border-radius:50%;width:30px;height:30px;color:#fff}
.amt{position:absolute;top:44%;width:100%;text-align:center;font-size:40px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.det{position:absolute;top:62%;left:50%;transform:translateX(-50%);background:#fff;color:#333;border:0;border-radius:20px;padding:8px 22px;font-weight:600;font-size:13px}
.pills{display:flex;gap:10px;margin-bottom:14px}.pill{flex:1;background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:12px 6px;font-weight:600;font-size:14px;border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px}
.quote{background:linear-gradient(#e4d8f6,#d6c6f0);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:var(--sh);color:#2a2040;font-size:14px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11px;font-weight:600}.feat div{font-size:34px}.feat span{display:block;font-size:11px}
.empty{text-align:center;padding:14px;color:var(--mut)}.empty div{font-size:38px}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(128,128,128,.2);font-size:14px}.in{color:#2e9e5b}.out{color:#e5484d}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav div{max-width:480px;margin:auto;display:flex;align-items:center}nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;font-weight:600;padding:4px}nav button.on{color:var(--ink)}nav button span{display:block;font-size:24px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{text-align:center;font-size:22px;margin:6px 0 16px}.sheet label{display:block;font-weight:800;margin:14px 0 6px;font-size:15px}
input,select{width:100%;font:inherit;padding:13px 14px;border-radius:16px;border:2px solid rgba(128,128,128,.25);background:var(--card);color:var(--ink)}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sw button{aspect-ratio:1;border-radius:14px;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.ft{display:flex;gap:10px;margin-top:18px}.ft button{flex:1;padding:14px;border-radius:18px;border:2px solid rgba(128,128,128,.3);background:none;color:var(--ink);font-weight:800;font:inherit;font-weight:800}.ft .pri{background:linear-gradient(90deg,#f6a6d0,#b9a4f2);border:0;color:#fff}
.row{display:flex;gap:8px}.seg{display:flex;gap:6px;margin-bottom:6px}.seg button{flex:1;padding:10px;border-radius:14px;border:2px solid rgba(128,128,128,.25);background:none;color:var(--ink);font-weight:600}.seg .on{background:#fdcb46;color:#222;border-color:#fdcb46}
:focus-visible{outline:3px solid #7a5af8;outline-offset:2px}
</style></head><body><div id="app"></div>
<nav><div id="nav"></div></nav><div id="sh"></div>
<script>
const K='mucuans.clone.v1',$=id=>document.getElementById(id),rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const TH=['#FDCB46','#8fb0f2','#9ccc65','#f4a6c8','#b9a4f2','#ffa862','#6fdcb4','#ff8f8f','#e5f08a','#a9c7e8'];
const SVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ea6cc"/><stop offset="1" stop-color="#cfe0ec"/></linearGradient><pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#fff"/><rect width="12" height="12" fill="#e79bb0"/><rect x="12" y="12" width="12" height="12" fill="#e79bb0"/></pattern></defs><rect width="300" height="340" fill="url(#s)"/><g fill="#fff" opacity=".85"><ellipse cx="70" cy="90" rx="60" ry="18"/><ellipse cx="110" cy="80" rx="40" ry="16"/><ellipse cx="240" cy="130" rx="55" ry="15"/></g><path d="M0 170 Q90 120 180 160 T300 150 V340 H0Z" fill="#8fb35e"/><path d="M0 220 Q120 170 300 215 V340 H0Z" fill="#6c9a45"/><polygon points="90,235 300,215 300,330 60,330" fill="url(#p)" opacity=".95"/><g transform="translate(228 205)"><ellipse cx="0" cy="22" rx="22" ry="8" fill="#0002"/><path d="M-20 10 Q0 40 20 10Z" fill="#b8793e"/><path d="M-18 10 Q0 -22 18 10" fill="none" stroke="#8a5a2b" stroke-width="3"/></g><g fill="#fff"><circle cx="40" cy="280" r="4"/><circle cx="260" cy="300" r="4"/><circle cx="30" cy="240" r="3"/></g></svg>`;
const PIC="url('data:image/svg+xml,"+encodeURIComponent(SVG).replace(/'/g,'%27')+"')";
let S={name:'Teman',aset:[{n:'Bca',bg:'pic',awal:0,tot:true}],tx:[],hide:false};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab='home',ai=0,tx={};
const saldo=a=>a.awal+S.tx.reduce((s,t)=>s+(t.t=='in'&&t.a==a.n?t.v:0)-(t.t=='out'&&t.a==a.n?t.v:0)-(t.t=='tf'&&t.a==a.n?t.v:0)+(t.t=='tf'&&t.to==a.n?t.v:0),0);
const total=()=>S.aset.filter(a=>a.tot).reduce((s,a)=>s+saldo(a),0);
const week=()=>S.tx.filter(t=>t.t=='out'&&Date.now()-t.ts<6048e5);
const bgc=a=>`style="--bgc:${a.bg=='pic'?PIC:a.bg}"`;
function list(arr){return arr.map(t=>`<div class="tx"><span>${t.note||{in:'Pemasukan',out:'Pengeluaran',tf:'Transfer'}[t.t]}<br><span class="mut">${t.a}${t.to?' → '+t.to:''} · ${t.d}</span></span><b class="${t.t=='in'?'in':'out'}">${t.t=='in'?'+':'-'}${rp(t.v)}</b></div>`).join('')}
function home(){const a=S.aset[ai]||S.aset[0],w=week(),ws=w.reduce((s,t)=>s+t.v,0);
return`<div class="glow" style="background:${a.bg=='pic'?'#6b8fb4':a.bg}"></div><div class="top"><div><h1 onclick="rn()">Halo, ${S.name}! 👋</h1><div class="mut">Yuk cek uang kamu hari ini</div></div><button class="rb" onclick="tm()" aria-label="Ganti tema">🐻‍❄️</button></div>
<div class="ta">🟧 TOTAL ASET<span style="flex:1"></span></div><div class="top" style="margin-top:-8px"><b style="font-size:17px">${S.hide?'Rp ••••':rp(total())}</b><button class="rb" style="width:40px;height:40px;font-size:16px" onclick="addAset()" aria-label="Tambah aset">＋</button></div>
<div class="stackw" ontouchstart="ts(event)" ontouchend="te(event)"><div class="asset" ${bgc(a)} onpointermove="tl(event)" onpointerleave="this.style.transform=''"><div class="chip">💳 ${a.n}</div><button class="pen" onclick="edit(${ai})" aria-label="Edit aset">✎</button><button class="ib" onclick="S.hide=!S.hide;sv();R()" aria-label="Sembunyikan saldo">${S.hide?'🙈':'👁'}</button><div class="amt">${S.hide?'Rp ••••':rp(saldo(a))}</div><button class="det" onclick="tab='trx';R()">Lihat Detail &gt;&gt;</button></div></div>
${S.aset.length>1?`<div class="row" style="justify-content:center;margin-top:10px">${S.aset.map((x,i)=>`<button class="rb" style="width:auto;height:34px;padding:0 12px;font-size:12px;${i==ai?'outline:2px solid #7a5af8':''}" onclick="ai=${i};R()">${x.n}</button>`).join('')}</div>`:''}
<h2>Yuk Catat!</h2><div class="pills"><div class="pill cap"><button onclick="add('in')"><span class="dot" style="background:#cdeedd">↙</span>Pemasukan</button><button onclick="add('out')"><span class="dot" style="background:#fcd3d3">↗</span>Pengeluaran</button></div><button class="pill" onclick="add('tf')"><span class="dot" style="background:#d3dcfc">⇆</span>Transfer</button></div>
<div class="quote" onclick="qt()">🐻‍❄️ <span id="q" style="flex:1">Kata-kata Mucuw hari ini</span>✉️</div>
<h2>Features</h2><div class="card feat"><div onclick="tab='rep';R()">💸<span>Cuan Performance</span></div><div onclick="toast('Budgeting Challenge segera hadir 🐻‍❄️')">🎯<span>Budgeting Challenge</span></div><div onclick="toast('Dream Journey segera hadir ✨')">🌙<span>Dream Journey</span></div><div onclick="toast('Couple segera hadir 💑')">💑<span>Couple</span></div></div>
<div class="card"><h2 style="margin:0 0 10px">Pengeluaran Minggu Ini</h2>${w.length?`<b style="font-size:22px">${rp(ws)}</b>`+list(w.slice(0,5)):'<div class="empty"><div>🌱</div>Belum ada pengeluaran minggu ini 🌱</div>'}</div>
<div class="top"><h2 style="margin:0">Transaksi Terakhir</h2><b style="font-size:13px" onclick="tab='trx';R()">Lihat Semua →</b></div>
<div class="card" style="margin-top:10px">${S.tx.length?list(S.tx.slice(0,5)):'<div class="empty"><div>📝</div><b>Belum ada transaksi nih!</b><br>Yuk mulai catat keuangan kamu</div>'}</div>`}
function trx(){return`<h1>Transaksi</h1><div class="card" style="margin-top:14px">${S.tx.length?list(S.tx):'<div class="empty"><div>📝</div>Belum ada transaksi nih!</div>'}</div>`}
function rep(){const m={};S.tx.filter(t=>t.t=='out').forEach(t=>m[t.cat||'Lainnya']=(m[t.cat||'Lainnya']||0)+t.v);const mx=Math.max(1,...Object.values(m)),i=S.tx.filter(t=>t.t=='in').reduce((s,t)=>s+t.v,0),o=S.tx.filter(t=>t.t=='out').reduce((s,t)=>s+t.v,0);
return`<h1>Report</h1><div class="card" style="margin-top:14px"><div class="top"><span>Total masuk<br><b class="in">${rp(i)}</b></span><span style="text-align:right">Total keluar<br><b class="out">${rp(o)}</b></span></div></div><div class="card"><b>Pengeluaran per kategori</b>${Object.keys(m).map(k=>`<div style="margin-top:10px">${k} · ${rp(m[k])}<div style="height:10px;border-radius:9px;background:rgba(128,128,128,.2);margin-top:4px"><div style="height:100%;width:${m[k]/mx*100}%;background:#fdcb46;border-radius:9px"></div></div></div>`).join('')||'<div class="empty">Belum ada data</div>'}</div>`}
function scan(){return`<h1>Scan Struk</h1><div class="card empty" style="margin-top:14px"><div>🧾</div>Fitur scan butuh kamera dan AI, belum tersedia di versi ini.<br>Catat manual dulu lewat tombol <b>＋</b>.</div>`}
function R(){$('app').innerHTML={home,trx,rep,scan}[tab]();$('nav').innerHTML=[['home','🏠','Home'],['scan','📷','Scan Struk'],['+'],['trx','📒','Transaksi'],['rep','📈','Report']].map(t=>t[0]=='+'?`<button onclick="add('out')" style="font-size:34px;color:var(--ink)" aria-label="Catat">＋</button>`:`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';R()"><span>${t[1]}</span>${t[2]}</button>`).join('')}
function tm(){const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark'}
function rn(){const n=prompt('Nama kamu?',S.name);if(n){S.name=n.slice(0,20);sv();R()}}
const Q=['Sedikit demi sedikit, lama-lama jadi bukit tabungan 🐻‍❄️','Jajan boleh, asal catat ya!','Dompet sehat, hati senang ✨','Hari ini udah nabung belum?'];let qi=0;function qt(){$('q').textContent=Q[qi++%Q.length]}
function close_(){$('sh').innerHTML=''}
function add(t){tx={t};const cats=['Makan','Transport','Jajan','Tagihan','Hiburan','Lainnya'],as=S.aset.map(a=>`<option>${a.n}</option>`).join('');
$('sh').innerHTML=`<div class="sheetbg" onclick="if(event.target==this)close_()"><div class="sheet"><h3>${{in:'Pemasukan',out:'Pengeluaran',tf:'Transfer'}[t]}</h3>
<label>Nominal</label><input id="v" type="number" inputmode="numeric" placeholder="0"><label>${t=='tf'?'Dari aset':'Aset'}</label><select id="as">${as}</select>
${t=='tf'?`<label>Ke aset</label><select id="to">${as}</select>`:''}${t=='out'?`<label>Kategori</label><select id="cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select>`:''}
<label>Catatan</label><input id="note" placeholder="Opsional"><div class="ft"><button onclick="close_()">Batal</button><button class="pri" onclick="saveTx()">Simpan</button></div></div></div>`}
function saveTx(){const v=+$('v').value;if(!v||v<=0)return alert('Isi nominal dulu ya');const a=$('as').value,to=$('to')?$('to').value:'';if(tx.t=='tf'&&a==to)return alert('Pilih aset tujuan yang berbeda');
S.tx.unshift({t:tx.t,v,a,to:to||undefined,cat:$('cat')?$('cat').value:undefined,note:$('note').value,d:new Date().toISOString().slice(0,10),ts:Date.now()});sv();close_();R()}
function addAset(){S.aset.push({n:'Aset '+(S.aset.length+1),bg:TH[S.aset.length%10],awal:0,tot:true});ai=S.aset.length-1;sv();edit(ai)}
function edit(i){const a=S.aset[i];$('sh').innerHTML=`<div class="sheetbg" onclick="if(event.target==this)close_()"><div class="sheet"><h3>Edit Aset</h3>
<label>Tipe Aset &amp; Icon</label><div class="card" style="margin:0;padding:12px">🟧 Dompet Reguler</div><div class="mut" style="margin-top:6px">💡 Dompet untuk transaksi harian (rekening, e-wallet, tunai). Saldo berubah otomatis saat catat pemasukan &amp; pengeluaran.</div>
<label>Nama Tabungan / Aset</label><input id="en" value="${a.n}"><label>Background Tema &amp; Preview</label><div class="pvw"><div class="pcard" id="pc" style="--bgc:${a.bg=='pic'?PIC:a.bg}" onpointermove="rt(event)"><span class="dompet">DOMPET</span><b>${a.n}<br>${rp(saldo(a))}</b></div><div class="mut">✨ Live Preview · geser untuk memutar</div></div><div class="sw"><button class="${a.bg=='pic'?'on':''}" style="background:linear-gradient(#8fb3d0,#6a9a50)" onclick="sb('pic')" aria-label="Piknik"></button>${TH.map(c=>`<button class="${a.bg==c?'on':''}" style="background:${c}" onclick="sb('${c}')" aria-label="Warna ${c}"></button>`).join('')}</div>
<label style="display:flex;justify-content:space-between;align-items:center">Saldo Awal (opsional)<span class="badge">Sesuaikan Saldo</span></label><input id="ea" type="number" inputmode="numeric" value="${a.awal}"><label style="display:flex;justify-content:space-between;align-items:center">Hitung sebagai Total Aset<input id="et" type="checkbox" style="width:24px;height:24px" ${a.tot?'checked':''}></label>
<div class="auto" onclick="toast('Auto-Deteksi masih BETA, belum tersedia')"><span>🔔 Auto-Deteksi Transaksi<span class="beta">BETA</span></span>›</div><div class="ft"><button onclick="close_()">Batal</button><button class="pri" onclick="saveAset(${i})">Simpan</button></div>${S.aset.length>1?`<div class="ft"><button onclick="delAset(${i})" style="color:#e5484d">Hapus aset</button></div>`:''}</div></div>`;window._bg=a.bg}
function sb(c){window._bg=c;$('pc').style.setProperty('--bgc',c=='pic'?PIC:c);document.querySelectorAll('.sw button').forEach(b=>b.classList.remove('on'));event.target.classList.add('on')}
function saveAset(i){const a=S.aset[i],old=a.n,n=$('en').value.trim()||old;S.tx.forEach(t=>{if(t.a==old)t.a=n;if(t.to==old)t.to=n});Object.assign(a,{n,awal:+$('ea').value||0,tot:$('et').checked,bg:window._bg||a.bg});sv();close_();R()}
function delAset(i){if(!confirm('Hapus aset ini beserta transaksinya?'))return;const n=S.aset[i].n;S.tx=S.tx.filter(t=>t.a!=n&&t.to!=n);S.aset.splice(i,1);ai=0;sv();close_();R()}
let _x=0;function ts(e){_x=e.touches[0].clientX}function te(e){const d=e.changedTouches[0].clientX-_x;if(Math.abs(d)>50&&S.aset.length>1){ai=(ai+(d<0?1:S.aset.length-1))%S.aset.length;R()}}
function tl(e){if(e.pointerType=='touch')return;const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;e.currentTarget.style.transform=`perspective(700px) rotateY(${x*10}deg) rotateX(${-y*8}deg)`}
function rt(e){const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5;e.currentTarget.style.transform=`rotateY(${x*70}deg)`}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
R();
</script></body></html>
