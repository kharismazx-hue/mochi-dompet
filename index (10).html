<style>

:root[data-theme="dark"]{--bg:#2a2438;--card:#3b3352;--ink:#fff4e8;--line:#e9dcff;--sh:#120f1c;--muted:#b5abd0}
:root[data-theme="plain"]{--bg:#fff}
:root[data-theme="bold"]{--bg:#FFE45C;--lav:#B79CFF;--mint:#5EE6A0;--sky:#6FB5FF;--pink:#FF8DBF;--lemon:#FFF27A;--coral:#FF5C4D}
.pr{background:var(--card);border:2.5px solid var(--line);border-radius:22px;overflow:hidden;margin-top:14px}

.sg{margin-left:auto;display:flex;border:2.5px solid var(--line);border-radius:99px;padding:3px;gap:2px;flex:none}

.sg button.on{background:linear-gradient(90deg,#F8A8D2,#C9B6FF);color:#241f35}
.bd{font-size:10px;font-weight:900;border-radius:99px;padding:2px 8px;color:#241f35;margin-left:4px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tri button{font:inherit;font-weight:900;font-size:11px;color:#241f35;border:2px solid var(--line);border-radius:18px;padding:12px 4px;cursor:pointer}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-size:14px;margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:600}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:480px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{margin:0;font-weight:900}

.in{color:#1f9d63}.out{color:#e0453a}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:3px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}

.wg{width:168px;height:168px;border:3px solid var(--line);position:relative;overflow:hidden;color:#241f35;padding:14px;background:linear-gradient(160deg,#BFD9FF,#DCCBFF 60%,#FFC2DD);box-shadow:4px 4px 0 var(--sh);display:flex;flex-direction:column;justify-content:space-between;flex:none}

.hero{margin:-18px -16px 0;padding:18px 16px 24px;background:linear-gradient(#CFE6FF,#EAF6FF 60%,#FFF8D6);border-radius:0 0 34px 34px;color:#241f35}

.wcim .wamt{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.65)}

.wpan{background:rgba(255,255,255,.93);border-radius:24px;padding:10px;color:#241f35}
.wt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{border-radius:18px;padding:12px 4px;text-align:center;font-size:10px;font-weight:900;border:1.5px solid rgba(36,31,53,.08)}
.tl b{display:block;font-size:12px;margin-top:3px;word-break:break-all}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pl{background:var(--card);border-radius:26px;border:2px solid color-mix(in srgb,var(--line) 12%,transparent);box-shadow:0 5px 0 color-mix(in srgb,var(--line) 16%,transparent),0 9px 14px rgba(36,31,53,.08)}

.bgx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;font-style:normal;color:#241f35;box-shadow:inset 0 -3px 0 rgba(36,31,53,.12)}

.fab{display:none}
.wg .br{display:flex;gap:6px;align-items:center}.wg.ci .br{justify-content:center}

.ipk{width:96px;height:96px;border-radius:18px;border:2.5px dashed var(--line);display:grid;place-items:center;text-align:center;font:inherit;font-size:10px;font-weight:800;cursor:pointer;overflow:hidden;flex:none;color:var(--muted);background:var(--bg);padding:0}.ipk img{width:100%;height:100%;object-fit:cover}
.sw{width:52px;height:30px;border-radius:99px;border:2.5px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--line)}.sw.on{background:linear-gradient(90deg,#F8A8D2,#C9B6FF)}.sw.on::after{left:24px}
.pk{width:100%;display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;padding:11px 12px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
.wcard{padding:4px 0}.wbub{margin-top:14px;padding:16px;border-radius:22px;background:color-mix(in srgb,#C9B6FF 22%,var(--card));border:2px solid color-mix(in srgb,var(--line) 14%,transparent);font-weight:700;line-height:1.6;font-size:13px}
.krow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:18px;border:2px solid color-mix(in srgb,var(--line) 14%,transparent);background:var(--card)}.krow .ke{font-size:20px}.kb{font-size:10px;font-weight:800;color:var(--muted);background:var(--bg);padding:4px 10px;border-radius:99px}.krow .wi{width:34px;height:34px;background:var(--bg)}
.thd{background:linear-gradient(180deg,#B3D2FF,#9DC1FA);margin:-18px -16px 16px;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 22px;border-radius:0 0 34px 34px;color:#fff}

.fts{display:flex;gap:8px}.ft{flex:1;border:0;border-radius:99px;padding:14px 4px;font:inherit;font-weight:800;font-size:13px;background:var(--bg);color:var(--ink);cursor:pointer}.ft.on{background:#000;color:#F6F26B}

.dgh{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 10px}

.wp{background:var(--bg);border-radius:99px;padding:6px 12px;font-weight:800;font-size:11px;color:var(--muted)}

.tnote{font-weight:900;font-size:17px;margin-top:8px}
.rhd{background:linear-gradient(180deg,#FF9A8E,#EB5E50);color:#fff;margin:-18px -16px 16px;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 22px;border-radius:0 0 40px 40px}.rhd h1{color:#fff}
